name: Build & Deploy Angular to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # Batalkan build lama jika ada commit baru yang masuk secara cepat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Cache NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # Menggunakan cache npm bawaan GitHub Actions

      # Caching kompilasi Angular CLI (.angular/cache)
      - name: Cache Angular Build
        uses: actions/cache@v4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-cache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-angular-cache-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build Angular app
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          # Ambil nama repo untuk base-href (otomatis cocok untuk GitHub Pages)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          npm run build -- --configuration production --base-href "/${REPO_NAME}/"

      - name: Fix SPA 404 Routing for GitHub Pages
        run: |
          DIST_PATH="./dist/dafina-app"
          if [ -d "$DIST_PATH" ]; then
            DIST_PATH="$DIST_PATH"
          fi

          # Copy index.html ke 404.html agar direct refresh SPA tidak 404
          if [ -f "$DIST_PATH/index.html" ]; then
            cp "$DIST_PATH/index.html" "$DIST_PATH/404.html"
          fi
          echo "FINAL_DIST=$DIST_PATH" >> $GITHUB_ENV

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.FINAL_DIST }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
